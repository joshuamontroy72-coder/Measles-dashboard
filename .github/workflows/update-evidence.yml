name: Update measles evidence dashboard

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-measles-evidence
  cancel-in-progress: false

jobs:
  update-evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Harvest evidence
        run: npm run update:evidence
        env:
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          EVIDENCE_LOOKBACK_DAYS: "90"
          MAX_EVIDENCE_ITEMS: "2500"

      - name: Commit updated evidence data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/evidence.json

          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
          else
            git commit -m "chore: update measles evidence data"
            git pull --rebase origin main
            git push origin main
          fi
